displayName: 'NeMo-RL Metrics (Branch)'
gridLayout:
  columns: '3'
  widgets:
  - title: 'Training Loss'
    xyChart:
      dataSets:
      - timeSeriesQuery:
          timeSeriesFilter:
            filter: metric.type="custom.googleapis.com/rl.train.loss"
            aggregation:
              perSeriesAligner: ALIGN_MEAN
              crossSeriesReducer: REDUCE_MEAN
              alignmentPeriod: 60s
          unitOverride: '1'
        plotType: LINE
      timeshiftDuration: 0s
      yAxis:
        label: y1
        scale: LINEAR
  - title: 'Mean Reward'
    xyChart:
      dataSets:
      - timeSeriesQuery:
          timeSeriesFilter:
            filter: metric.type="custom.googleapis.com/rl.environment.reward.mean"
            aggregation:
              perSeriesAligner: ALIGN_MEAN
              crossSeriesReducer: REDUCE_MEAN
